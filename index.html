<!DOCTYPE html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tech Commerce</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Panou de administrare</p>
          <h1>Tech Commerce</h1>
          <p class="storage-note">Magazin de tehnologie · Produsele sunt gestionate de API-ul local.</p>
        </div>
      </header>

      <nav class="main-nav" aria-label="Navigare principală">
        <a href="#/">Acasă</a>
        <a href="#/products">Produse</a>
        <a href="#/about">Despre</a>
      </nav>

      <main class="layout">
        <p id="appMessage" class="app-message" role="status" aria-live="polite" hidden></p>

        <section class="panel form-panel" id="productFormPanel">
          <h2 id="formTitle">Adăugare produs</h2>

          <form id="productForm">
            <div class="field-grid">
              <label>
                <span>Nume produs</span>
                <input id="name" name="name" type="text" placeholder="Ex: Laptop Lenovo ThinkPad" required />
              </label>

              <label>
                <span>Categorie</span>
                <input id="category" name="category" type="text" placeholder="Ex: Laptopuri, Periferice" required />
              </label>

              <label>
                <span>Preț</span>
                <input id="price" name="price" type="number" min="0" step="0.01" placeholder="299.99" required />
              </label>

              <label>
                <span>Cantitate</span>
                <input id="quantity" name="quantity" type="number" min="0" step="1" placeholder="10" required />
              </label>

              <label>
                <span>Status</span>
                <select id="status" name="status">
                  <option value="available">Disponibil</option>
                  <option value="out_of_stock">Stoc epuizat</option>
                  <option value="inactive">Inactiv</option>
                </select>
              </label>
            </div>

            <div class="actions">
              <button type="submit" class="primary-btn">Salvează</button>
              <button type="button" class="secondary-btn" id="resetFormBtn">Reset</button>
            </div>
          </form>
        </section>

        <section class="panel list-panel" id="productListPanel">
          <div class="list-header">
            <h2>Produse</h2>
            <input id="searchInput" type="search" placeholder="Caută produs..." />
            <select id="categoryFilter" aria-label="Filtrează după categorie">
              <option value="">Toate categoriile</option>
            </select>
            <select id="sortSelect" aria-label="Sortează produsele">
              <option value="">Ordine implicită</option>
              <option value="name">Nume A–Z</option>
              <option value="price-asc">Preț crescător</option>
              <option value="price-desc">Preț descrescător</option>
            </select>
          </div>
          <button type="button" class="secondary-btn retry-btn" id="retryButton" hidden>Reîncearcă încărcarea</button>

          <div class="table-wrapper">
            <table>
              <thead>
                <tr>
                  <th>Nume</th>
                  <th>Categorie</th>
                  <th>Preț</th>
                  <th>Cantitate</th>
                  <th>Status</th>
                  <th>Acțiuni</th>
                </tr>
              </thead>
              <tbody id="productTableBody"></tbody>
            </table>
          </div>
        </section>

        <section class="panel route-page" id="routePage" hidden></section>
      </main>
    </div>

    <script src="router.js"></script>
    <script src="product-api.js"></script>
    <script src="script.js"></script>
  </body>
</html>
